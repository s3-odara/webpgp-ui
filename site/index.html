<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <title>PGP Encrypt Only</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>s3-odaraに暗号化するページ</h1>
        <p class="lead">ここで暗号化したメッセージをコピーして適当に送信してください。</p>
      </header>

      <section class="panel">
        <div class="meta">
          <div>
            <div class="label">Fingerprint</div>
            <div id="fingerprint" class="mono">読み込み中...</div>
          </div>
          <div>
            <div class="label">OpenPGP.js</div>
            <div id="openpgp-version" class="mono">-</div>
          </div>
        </div>
        <div id="error" class="error" role="alert" aria-live="polite"></div>

        <label class="field">
          <span>平文</span>
          <textarea id="plaintext" rows="5" placeholder="ここに暗号化したいテキストを入力してください" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        </label>
        <div class="actions">
          <button id="encrypt" type="button">暗号化</button>
        </div>

        <label class="field">
          <span>暗号化結果（armored）</span>
          <textarea id="ciphertext" rows="5" readonly></textarea>
        </label>
        <div class="actions">
          <button id="copy" type="button">コピー</button>
          <span id="copy-status" class="copy-status" role="status" aria-live="polite">copied</span>
        </div>

        <div class="divider"></div>

        <label class="field">
          <span>ファイル（複数選択可）</span>
          <input id="file-input" type="file" multiple>
        </label>
        <label class="field">
          <span>フォルダ（webkitdirectory 対応ブラウザ）</span>
          <input id="folder-input" type="file" webkitdirectory directory multiple>
        </label>
        <section class="selected-files" aria-labelledby="selected-files-heading">
          <div class="selected-files-header">
            <div>
              <div id="selected-files-heading" class="label">選択済みファイル</div>
              <div id="selected-files-summary" class="selected-files-summary" role="status" aria-live="polite">0件 / 0 B</div>
            </div>
            <button id="clear-files" class="clear-files" type="button">すべてクリア</button>
          </div>
          <ul id="selected-files-list" class="selected-files-list" aria-label="選択済みファイルの一覧">
            <li class="selected-files-empty">ファイルは選択されていません。</li>
          </ul>
        </section>
        <div class="actions">
          <button id="encrypt-files" type="button">ファイル/フォルダを暗号化</button>
        </div>
        <section class="download" aria-labelledby="encrypted-files-heading">
          <div id="encrypted-files-heading" class="label">暗号化済みファイル</div>
          <div id="download-name" class="mono">-</div>
          <div id="encrypted-files-summary" class="selected-files-summary" role="status" aria-live="polite">まだありません</div>
          <ul id="encrypted-files-list" class="selected-files-list encrypted-files-list" aria-label="暗号化済みファイルの一覧">
            <li class="selected-files-empty">暗号化済みファイルはまだありません。</li>
          </ul>
          <a id="download-link" class="download-link" href="#" download>ダウンロード</a>
        </section>
      </section>
    </main>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
