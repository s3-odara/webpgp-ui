<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <title>PGP Encrypt Only</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <h1>s3-odaraに暗号化するページ</h1>
      </header>

      <section class="panel">
        <div id="error" class="error" role="alert" aria-live="polite"></div>

        <label class="field">
          <span>平文</span>
          <textarea id="plaintext" rows="5" placeholder="ここに暗号化したいテキストを入力してください" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        </label>
        <div class="actions">
          <button id="encrypt" type="button">暗号化</button>
        </div>

        <label class="field">
          <span>暗号化結果</span>
          <textarea id="ciphertext" rows="5" readonly></textarea>
        </label>
        <div class="actions">
          <button id="copy" type="button">コピー</button>
          <span id="copy-status" class="copy-status" role="status" aria-live="polite">copied</span>
        </div>

        <div class="divider"></div>

        <div class="actions">
          <input id="file-input" class="visually-hidden file-picker-input" type="file" multiple>
          <label class="file-picker-button" for="file-input">ファイルを追加</label>
          <input id="folder-input" class="visually-hidden file-picker-input" type="file" webkitdirectory directory multiple>
          <label class="file-picker-button" for="folder-input">フォルダを追加</label>
        </div>
        <section class="file-list-panel" aria-labelledby="selected-files-heading">
          <div class="file-list-header">
            <div>
              <div id="selected-files-heading" class="label">選択中ファイル</div>
              <div id="selected-files-summary" class="file-list-summary" role="status" aria-live="polite">0件 / 0 B</div>
            </div>
            <button id="clear-files" class="clear-files" type="button">すべてクリア</button>
          </div>
          <ul id="selected-files-list" class="file-list file-list-selected" aria-label="選択中ファイルの一覧">
            <li class="file-list-empty">ファイルは選択されていません。</li>
          </ul>
        </section>
        <div class="actions">
          <button id="encrypt-files" type="button">ファイル/フォルダを暗号化</button>
        </div>
        <section class="file-list-panel download" aria-labelledby="encrypted-files-heading">
          <div class="file-list-header">
            <div>
              <div id="encrypted-files-heading" class="label">暗号化済みファイル</div>
              <div id="encrypted-files-summary" class="file-list-summary" role="status" aria-live="polite" hidden></div>
            </div>
            <div id="download-name" class="mono">-</div>
          </div>
          <ul id="encrypted-files-list" class="file-list" aria-label="暗号化済みファイルの一覧" hidden></ul>
          <div class="download-actions">
            <a id="download-link" class="download-link" href="#" download>ダウンロード</a>
          </div>
        </section>
      </section>

      <footer class="app-footer">
        <span class="label">OpenPGP.js</span>
        <span id="openpgp-version" class="mono">-</span>
      </footer>
    </main>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
